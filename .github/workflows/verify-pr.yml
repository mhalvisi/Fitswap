name: Validar FitSwap em revisão
on:
  pull_request:
    branches: [main, feature/catalogo-1-2-expansao]
  push:
    branches: [feature/catalogo-visual-1-1, feature/catalogo-1-2-expansao, feature/substituicoes-1-3-beta]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
